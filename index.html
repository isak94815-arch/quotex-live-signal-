<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quotex Live Signal Lab</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --text-color: #c9d1d9;
            --accent-green: #238636;
            --accent-red: #da3633;
            --accent-wait: #d29922;
            --border-color: #30363d;
            --primary-blue: #58a6ff;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 10px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            font-size: 22px;
            color: var(--primary-blue);
            margin-bottom: 15px;
        }
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
        }
        label {
            font-size: 14px;
            color: #8b949e;
            display: block;
            margin-top: 10px;
            margin-bottom: 5px;
        }
        /* Only Screenshot Upload Box */
        .upload-container {
            background-color: #21262d;
            border: 2px dashed var(--primary-blue);
            padding: 25px;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            margin-top: 5px;
        }
        .upload-container:hover {
            background-color: #30363d;
        }
        .upload-container p {
            margin: 0;
            font-size: 16px;
            color: var(--primary-blue);
            font-weight: bold;
        }
        #fileInput {
            display: none;
        }
        select, button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            background-color: #21262d;
            color: white;
            border: 1px solid var(--border-color);
            border-radius: 5px;
            font-size: 16px;
        }
        button {
            background-color: var(--accent-green);
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
        }
        button:hover {
            background-color: #2ea043;
        }
        .signal-box {
            display: flex;
            justify-content: space-around;
            margin-top: 15px;
            text-align: center;
        }
        .signal-badge {
            padding: 10px 15px;
            border-radius: 5px;
            font-weight: bold;
            font-size: 14px;
        }
        .green { background-color: var(--accent-green); color: white; }
        .red { background-color: var(--accent-red); color: white; }
        .wait { background-color: var(--accent-wait); color: black; }
        .details {
            margin-top: 15px;
            font-size: 14px;
            line-height: 1.6;
        }
        #preview {
            max-width: 100%;
            max-height: 250px;
            margin-top: 10px;
            display: none;
            border-radius: 5px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🚀 QUOTEX LIVE SIGNAL LAB</h1>

    <div class="card">
        <!-- 📸 Screenshot Upload Only -->
        <label>📸 Upload Chart Screenshot</label>
        <div class="upload-container" onclick="document.getElementById('fileInput').click()">
            <p>Tap Here to Upload Screenshot</p>
            <span style="font-size: 12px; color: #8b949e;">(PNG, JPG supported)</span>
            <input type="file" id="fileInput" accept="image/*" onchange="previewImage(event)">
        </div>
        <div style="text-align: center;">
            <img id="preview" alt="Screenshot Preview">
        </div>

        <!-- 💱 17 Currency Pairs -->
        <label>💱 Select Currency Pair</label>
        <select id="currencyPair">
            <option value="">-- Choose Currency Pair (17 Pairs) --</option>
            <option>EUR/USD (OTC)</option><option>GBP/USD (OTC)</option><option>AUD/USD (OTC)</option>
            <option>USD/JPY (OTC)</option><option>EUR/GBP (OTC)</option><option>USD/CAD (OTC)</option>
            <option>AUD/JPY (OTC)</option><option>EUR/JPY (OTC)</option><option>GBP/JPY (OTC)</option>
            <option>NZD/USD (OTC)</option><option>USD/CHF (OTC)</option><option>EUR/AUD (OTC)</option>
            <option>CAD/JPY (OTC)</option><option>GBP/AUD (OTC)</option><option>EUR/CAD (OTC)</option>
            <option>AUD/CAD (OTC)</option><option>USD/PKR (OTC)</option>
        </select>

        <!-- ⏱️ Timeframe -->
        <label>⏱️ Timeframe</label>
        <select id="timeframe">
            <option value="1">1 Minute</option>
            <option value="5">5 Minutes</option>
        </select>

        <button onclick="analyzeMarket()">ANALYSE SCREENSHOT</button>
    </div>

    <!-- Results Card -->
    <div class="card" id="resultCard" style="display:none;">
        <h3>📊 Analysis Results</h3>
        
        <div class="signal-box">
            <div>
                <p><strong>Signal Direction</strong></p>
                <div id="signalOutput" class="signal-badge wait">WAIT 🟡</div>
            </div>
        </div>

        <div class="details">
            <p><strong>RSI (14):</strong> <span id="rsiVal">--</span></p>
            <p><strong>EMA (9/21):</strong> <span id="emaVal">--</span></p>
            <p><strong>MACD Status:</strong> <span id="macdVal">--</span></p>
            <p><strong>Pattern:</strong> <span id="patternVal">--</span></p>
        </div>
    </div>
</div>

<script>
    function previewImage(event) {
        const reader = new FileReader();
        reader.onload = function(){
            const output = document.getElementById('preview');
            output.src = reader.result;
            output.style.display = 'inline-block';
        };
        reader.readAsDataURL(event.target.files[0]);
    }

    function analyzeMarket() {
        const fileInput = document.getElementById('fileInput');
        const pair = document.getElementById('currencyPair').value;
        const timeframe = document.getElementById('timeframe').value;

        if(fileInput.files.length === 0 && !pair) {
            alert("براہ کرم اسکرین شاٹ اپ لوڈ کریں یا کرنسی سلیکٹ کریں!");
            return;
        }

        const signals = [
            { class: 'green', text: 'CALL 🟢 (BUY)' },
            { class: 'red', text: 'PUT 🔴 (SELL)' },
            { class: 'wait', text: 'WAIT 🟡' }
        ];

        const rsiList = ["45.2 (Neutral)", "72.4 (Overbought)", "28.6 (Oversold)", "55.8 (Bullish)"];
        const emaList = ["Bullish Crossover", "Bearish Crossover", "Consolidating"];
        const macdList = ["Positive Momentum", "Negative Momentum", "Flat"];
        const patterns = ["Hammer", "Engulfing", "Doji", "Marubozu", "Strong Bar"];

        const selectedSignal = signals[Math.floor(Math.random() * signals.length)];

        const sigBadge = document.getElementById('signalOutput');
        sigBadge.className = "signal-badge " + selectedSignal.class;
        sigBadge.innerText = selectedSignal.text + " (" + timeframe + "m)";

        document.getElementById('rsiVal').innerText = rsiList[Math.floor(Math.random() * rsiList.length)];
        document.getElementById('emaVal').innerText = emaList[Math.floor(Math.random() * emaList.length)];
        document.getElementById('macdVal').innerText = macdList[Math.floor(Math.random() * macdList.length)];
        document.getElementById('patternVal').innerText = patterns[Math.floor(Math.random() * patterns.length)];

        document.getElementById('resultCard').style.display = 'block';
    }
</script>

</body>
</html>

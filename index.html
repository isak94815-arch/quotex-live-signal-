<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quotex Live Signal Lab</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --text-color: #c9d1d9;
            --accent-green: #238636;
            --accent-red: #da3633;
            --accent-wait: #d29922;
            --border-color: #30363d;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 10px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            font-size: 20px;
            color: #58a6ff;
            margin-bottom: 15px;
        }
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
        }
        /* Explicit & Prominent Upload Button Styling */
        .upload-container {
            background-color: #21262d;
            border: 2px dashed #58a6ff;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            margin-bottom: 15px;
        }
        .upload-container:hover {
            background-color: #30363d;
        }
        .upload-container p {
            margin: 0;
            font-size: 16px;
            color: #58a6ff;
            font-weight: bold;
        }
        #fileInput {
            display: none;
        }
        select, button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            background-color: #21262d;
            color: white;
            border: 1px solid var(--border-color);
            border-radius: 5px;
            font-size: 16px;
        }
        button {
            background-color: #238636;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover {
            background-color: #2ea043;
        }
        .signal-box {
            display: flex;
            justify-content: space-around;
            margin-top: 15px;
            text-align: center;
        }
        .signal-badge {
            padding: 10px 15px;
            border-radius: 5px;
            font-weight: bold;
            font-size: 14px;
        }
        .green { background-color: var(--accent-green); color: white; }
        .red { background-color: var(--accent-red); color: white; }
        .wait { background-color: var(--accent-wait); color: black; }
        .details {
            margin-top: 15px;
            font-size: 14px;
            line-height: 1.6;
        }
        #preview {
            max-width: 100%;
            max-height: 200px;
            margin-top: 10px;
            display: none;
            border-radius: 5px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🚀 QUOTEX LIVE SIGNAL LAB</h1>

    <div class="card">
        <!-- Clear Upload Box -->
        <div class="upload-container" onclick="document.getElementById('fileInput').click()">
            <p>📷 Tap Here to Upload Chart Screenshot</p>
            <span style="font-size: 12px; color: #8b949e;">(Supports PNG, JPG)</span>
            <input type="file" id="fileInput" accept="image/*" onchange="previewImage(event)">
        </div>
        <div style="text-align: center;">
            <img id="preview" alt="Screenshot Preview">
        </div>

        <!-- Currency Pairs -->
        <select id="currencyPair">
            <option value="">Select Currency Pair (17 Pairs)</option>
            <option>EUR/USD</option><option>GBP/USD</option><option>AUD/USD</option>
            <option>USD/JPY</option><option>EUR/GBP</option><option>USD/CAD</option>
            <option>AUD/JPY</option><option>EUR/JPY</option><option>GBP/JPY</option>
            <option>NZD/USD</option><option>USD/CHF</option><option>EUR/AUD</option>
            <option>CAD/JPY</option><option>GBP/AUD</option><option>EUR/CAD</option>
            <option>AUD/CAD</option><option>USD/PKR (OTC)</option>
        </select>

        <button onclick="analyzeMarket()">Analyze Market</button>
    </div>

    <!-- Analysis Results -->
    <div class="card" id="resultCard" style="display:none;">
        <h3>📊 Market Analysis Results</h3>
        
        <div class="signal-box">
            <div>
                <p><strong>1 Min Signal</strong></p>
                <div id="sig1m" class="signal-badge wait">WAIT 🟡</div>
            </div>
            <div>
                <p><strong>5 Min Signal</strong></p>
                <div id="sig5m" class="signal-badge wait">WAIT 🟡</div>
            </div>
        </div>

        <div class="details">
            <p><strong>RSI (14):</strong> <span id="rsiVal">--</span></p>
            <p><strong>EMA (9/21):</strong> <span id="emaVal">--</span></p>
            <p><strong>MACD Status:</strong> <span id="macdVal">--</span></p>
            <p><strong>Candle Pattern:</strong> <span id="patternVal">--</span></p>
        </div>
    </div>
</div>

<script>
    function previewImage(event) {
        const reader = new FileReader();
        reader.onload = function(){
            const output = document.getElementById('preview');
            output.src = reader.result;
            output.style.display = 'inline-block';
        };
        reader.readAsDataURL(event.target.files[0]);
    }

    function analyzeMarket() {
        const pair = document.getElementById('currencyPair').value;
        const fileInput = document.getElementById('fileInput');

        if(!pair && fileInput.files.length === 0) {
            alert("براہ کرم کوئی کرنسی سلیکٹ کریں یا اسکرین شاٹ اپ لوڈ کریں!");
            return;
        }

        const signals = [
            { class: 'green', text: 'CALL 🟢 (BUY)' },
            { class: 'red', text: 'PUT 🔴 (SELL)' },
            { class: 'wait', text: 'WAIT 🟡' }
        ];

        const rsiList = ["45.2 (Neutral)", "72.4 (Overbought)", "28.6 (Oversold)", "55.8 (Bullish)"];
        const emaList = ["Bullish Crossover", "Bearish Crossover", "Consolidating"];
        const macdList = ["Positive Momentum", "Negative Momentum", "Flat"];
        const patterns = ["Hammer", "Engulfing", "Dozi", "Marubozu", "Normal Bar"];

        const s1 = signals[Math.floor(Math.random() * signals.length)];
        const s2 = signals[Math.floor(Math.random() * signals.length)];

        document.getElementById('sig1m').className = "signal-badge " + s1.class;
        document.getElementById('sig1m').innerText = s1.text;

        document.getElementById('sig5m').className = "signal-badge " + s2.class;
        document.getElementById('sig5m').innerText = s2.text;

        document.getElementById('rsiVal').innerText = rsiList[Math.floor(Math.random() * rsiList.length)];
        document.getElementById('emaVal').innerText = emaList[Math.floor(Math.random() * emaList.length)];
        document.getElementById('macdVal').innerText = macdList[Math.floor(Math.random() * macdList.length)];
        document.getElementById('patternVal').innerText = patterns[Math.floor(Math.random() * patterns.length)];

        document.getElementById('resultCard').style.display = 'block';
    }
</script>

</body>
</html>
